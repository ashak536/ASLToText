<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A local ASL fingerspelling webcam prototype."
    />
    <title>ASL to Text</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        line-height: 1.5;
        color: #202124;
        background: #f5f5f5;
      }

      body {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 16px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 1.8rem;
      }

      button,
      select,
      input {
        font: inherit;
      }

      button,
      select {
        padding: 7px 10px;
      }

      .camera {
        position: relative;
        overflow: hidden;
        aspect-ratio: 16 / 9;
        background: #111;
      }

      video,
      canvas {
        position: absolute;
        width: 100%;
        height: 100%;
        inset: 0;
        object-fit: contain;
        transform: scaleX(-1);
      }

      #status {
        position: absolute;
        top: 8px;
        left: 8px;
        padding: 3px 7px;
        color: white;
        background: rgb(0 0 0 / 65%);
        font-size: 0.85rem;
      }

      .controls,
      .camera-controls,
      .data-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .camera-controls {
        margin: 10px 0 16px;
      }

      textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 112px;
        margin: 8px 0;
        padding: 10px;
        resize: vertical;
        font: 1.2rem monospace;
      }

      details {
        margin-top: 18px;
      }

      #counts {
        margin-top: 8px;
      }

      @media (max-width: 480px) {
        body {
          padding: 16px 12px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ASL to Text</h1>

      <div class="camera" aria-label="Webcam preview">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>

      <div class="camera-controls">
        <button id="btnCamera" type="button">Start camera</button>
      </div>

      <label for="output">Translated text</label>
      <textarea
        id="output"
        readonly
        aria-live="polite"
        placeholder="Letters will appear here..."
      ></textarea>

    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
